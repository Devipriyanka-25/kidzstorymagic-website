name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kidz_story_magic
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          NODE_OPTIONS: '--max-old-space-size=1024'
        run: npm ci --legacy-peer-deps

      - name: Setup database
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kidz_story_magic
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test_secret
        run: npm run db:migrate

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kidz_story_magic
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test_secret
          # Mock API keys for tests
          OPENAI_API_KEY: test_key_mock
          AZURE_VISION_KEY: test_key_mock
          AZURE_VISION_ENDPOINT: https://test.cognitiveservices.azure.com/
          STRIPE_SECRET_KEY: sk_test_mock
        run: npm test -- --maxWorkers=2

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test -- --runInBand

      - name: Build application
        run: npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        working-directory: backend
        run: npm run lint || true

  deploy:
    needs: [test-backend, test-frontend, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here

  notification:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on success
        if: success()
        run: echo "✅ All checks passed!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Some checks failed"
